<div class="main-content">
  <p class="job-header empty-message" *ngIf="items.length === 0">
    You haven't saved any posts yet. Click "save" on a story to keep it here.
  </p>
  <ol *ngIf="items.length > 0" class="list-margin">
    <li *ngFor="let item of items" class="post">
      <item class="item-block" [item]="item"></item>
    </li>
  </ol>
</div>
